<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f5f5f5;
      width: 460px;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: #1a1a1a;
    }
    
    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    
    #textInput {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      box-sizing: border-box;
      resize: vertical;
      min-height: 60px;
    }
    
    #textInput:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
    }
    
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    #translateBtn {
      background-color: #0078d4;
      color: white;
    }
    
    #translateBtn:hover {
      background-color: #106ebe;
    }
    
    #translateBtn:active {
      background-color: #004a87;
    }
    
    #closeBtn {
      background-color: #e0e0e0;
      color: #1a1a1a;
    }
    
    #closeBtn:hover {
      background-color: #d0d0d0;
    }
    
    .tooltip {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #323232;
      color: white;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    
    .tooltip.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shift Paste - Fix Hebrew/English keyboard mistakes</h1>
    <div class="subtitle"><b>Paste</b> the text you copied and we'll fix it to the right language</div>
    <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    <div class="button-group">
      <button id="translateBtn">Translate & Copy</button>
      <button id="closeBtn">Close (Esc)</button>
    </div>
  </div>
  
  <div class="tooltip" id="tooltip"></div>
  
  <script src="../translate.js"></script>
  <script src="popup.js"></script>
</body>
</html>
